# XcodeGen's description of the Xcode project: `xcodegen generate` writes
# Dump.xcodeproj and DumpApp/Info.plist from it. Both are generated, so git
# ignores them; change this file, never the project in Xcode (AGENTS.md ›
# Project file).
name: Dump
options:
  bundleIdPrefix: com.marsuu1994.workbench
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  DumpCore:
    path: Packages/DumpCore
targets:
  Dump:
    type: application
    platform: iOS
    sources:
      - DumpApp
    dependencies:
      - package: DumpCore
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.marsuu1994.workbench.dump
        PRODUCT_NAME: Dump
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
    info:
      path: DumpApp/Info.plist
      properties:
        CFBundleDisplayName: Dump
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        DumpAPIBaseURL: $(DUMP_API_BASE_URL)
        DumpAPIToken: $(DUMP_API_TOKEN)
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.marsuu1994.workbench.dump.flush
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
